# Docker Compose for Prompt & Probe GPU experiment
#
# Drives the orchestrator from experiments/prompt_and_probe.py. Victim and
# attacker each get their own container, share the GPU via NVIDIA Container
# Toolkit, and communicate over the pp-net bridge (attacker hits victim
# at http://victim:8000).
#
# Variables (set by orchestrator):
#   MODEL_NAME, QUANT_MODE, SEED, HF_TOKEN
#
# The host pytorch venv is bind-mounted read-only so containers don't need
# to install ~5GB of torch/transformers/bitsandbytes.

services:
  victim:
    image: pp-victim:latest
    build:
      context: ../victim_service
    container_name: pp-victim
    environment:
      MODEL_NAME: ${MODEL_NAME:-meta-llama/Llama-3.2-1B}
      QUANT_MODE: ${QUANT_MODE:-fp16}
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
    volumes:
      - /opt/dlami/nvme/pytorch:/opt/pytorch:ro
      - hf-cache:/root/.cache/huggingface
    expose:
      - "8000"
    networks:
      - pp-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  attacker:
    image: pp-attacker:latest
    build:
      context: ../attacker
      dockerfile: Dockerfile.gpu
    container_name: pp-attacker
    environment:
      VICTIM_URL: http://victim:8000/generate
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
      CUMULATIVE_LENGTHS: ${CUMULATIVE_LENGTHS:-}
      ATTACKER_APPEND: ${ATTACKER_APPEND:-}
    volumes:
      - /opt/dlami/nvme/pytorch:/opt/pytorch:ro
      - ../results:/output
      - hf-cache:/root/.cache/huggingface
    networks:
      - pp-net
    depends_on:
      - victim
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - "--model"
      - "${MODEL_NAME:-meta-llama/Llama-3.2-1B}"
      - "--quant"
      - "${QUANT_MODE:-fp16}"
      - "--seed"
      - "${SEED:-0}"

networks:
  pp-net:
    driver: bridge

volumes:
  hf-cache:
